name: tests

# Le depot est public : une modification qui casse les tests doit se voir avant la fusion,
# pas apres la publication.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Verifier l'empreinte du moteur
        run: python tools/fetch_engine.py --verify

      - name: Tests
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
