name: tests

# Le depot est public : une modification qui casse les tests doit se voir avant la fusion,
# pas apres la publication. La matrice couvre Windows et Linux : le jour ou l'application
# sera portee, la CI doit deja savoir ce qui casse, et ou.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # tkinter n'est pas dans l'image Ubuntu : sans ce paquet, les tests d'interface
      # echouent a l'import. xvfb fournit l'affichage que X reclame.
      - name: Dependances systeme (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Verifier l'empreinte du moteur
        run: python tools/fetch_engine.py --verify

      - name: Tests (Windows)
        if: runner.os != 'Linux'
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q

      - name: Tests (Linux, avec affichage)
        if: runner.os == 'Linux'
        env:
          PYTHONUTF8: "1"
        run: xvfb-run -a python -m pytest -q
