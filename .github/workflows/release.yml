name: release

# Publier une version ne doit dependre ni d'un poste, ni d'un venv, ni d'un chemin D:\.
# Un tag pousse suffit : chaque binaire est reconstruit sur son systeme, verifie, puis
# attache a la version. Le tag doit correspondre a la version du paquet — un binaire
# annoncant 1.1.0 dans une version 1.2.0 serait indetectable pour qui telecharge.
#
# PyInstaller ne compile pas en croise : le binaire Linux ne peut naitre que d'un runner
# Linux, et le binaire Windows que d'un runner Windows. Deux constructions, une publication.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      - name: Verifier l'empreinte du moteur
        run: python tools/fetch_engine.py --verify

      - name: Construire les deux archives
        shell: pwsh
        env:
          SDB_PYTHON: python
          SDB_SORTIE: ${{ runner.temp }}\sortie
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File build\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: archives-windows
          path: ${{ runner.temp }}/sortie/dist/*.zip
          if-no-files-found: error

  linux:
    # Ubuntu 22.04, volontairement : la version de glibc exigée par le binaire est celle du
    # système qui le construit. Construit sur ubuntu-latest (26.04, glibc 2.42), il refusait de
    # démarrer sur Debian 13 (2.41) — rapporté le 26 novembre 2026 dans l'issue #5.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
          python -m pip install -e .

      - name: Verifier l'empreinte du moteur
        run: python tools/fetch_engine.py --verify

      - name: Construire les deux archives
        env:
          PYTHON: python
          SDB_GLIBC_MAX: "2.35"
        run: bash build/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: archives-linux
          path: build/dist/*.tar.gz
          if-no-files-found: error

  publier:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Le tag correspond-il a la version du paquet
        shell: bash
        run: |
          version=$(grep -Po '__version__ = "\K[^"]+' src/secdailybrief/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Le tag $tag ne correspond pas a la version $version du paquet." >&2
            exit 1
          fi
          echo "Version $version confirmee par le tag $GITHUB_REF_NAME."

      - name: Empreintes des archives
        shell: bash
        run: |
          # Un seul fichier a verifier, produit par la CI elle-meme : les empreintes recopiees
          # a la main dans les notes de version finissent toujours par diverger.
          cd dist
          ls -1 *.zip *.tar.gz | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Publier la version et y deposer les archives
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          count=$(ls -1 *.zip *.tar.gz | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "Quatre archives attendues, $count trouvee(s)." >&2
            exit 1
          fi
          titre="SecDailyBrief ${GITHUB_REF_NAME#v}"
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          # Rejouable : un tag deplace doit pouvoir republier par-dessus la version existante.
          # `gh release create` seul echouait avec « release already exists ».
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.zip ./*.tar.gz ./SHA256SUMS --clobber
            # Supprimer un tag transforme sa version en brouillon : sans cette ligne, elle
            # restait invisible sur la page des versions apres un tag deplace.
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --title "$titre" --generate-notes "${prerelease[@]}" \
              ./*.zip ./*.tar.gz ./SHA256SUMS
          fi
